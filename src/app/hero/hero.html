@let h = home();
@let ui = site.ui();
<section class="hero">
  <div class="container hero-grid">
    <div class="hero-text">
      <h1 class="hero-h1"><span class="pulse" aria-hidden="true"></span> {{ h.h1 }}</h1>
      <h2 class="hero-title">
        <span class="line"><span class="accent">{{ h.subtitle }}</span></span>
      </h2>
      <p class="lead">
        @for (p of h.lead; track $index) { {{ p }} }
      </p>
      <div class="hero-cta">
        <a [routerLink]="site.link('home')" [fragment]="ui.quoteAnchor" class="btn btn-lg">{{ ui.requestQuote }} <span aria-hidden="true">→</span></a>
        <a [routerLink]="site.link('proofreading')" [fragment]="ui.spellingAnchor" class="btn btn-lg btn-ghost">{{ h.spellingButton }}</a>
      </div>
    </div>

    <figure class="hero-photo">
      <picture>
        <!-- A kép kitölti a keretet (object-fit: cover), ezért szélesebben jelenik meg, mint a keret: 600 px magas × 1,5 = kb. 900 px. -->
        <source type="image/webp"
          srcset="/images/done-translations-csapat-800.webp 800w, /images/done-translations-csapat-1400.webp 1400w, /images/done-translations-csapat-2000.webp 2000w"
          sizes="(max-width: 960px) 100vw, 900px" />
        <img src="/images/done-translations-csapat.jpg" width="1400" height="934" [alt]="ui.hero.photoAlt" fetchpriority="high" decoding="async" />
      </picture>
      @for (b of ui.hero.badges; track b.title; let i = $index) {
        <div class="hero-badge" [class.gold]="i === 1" [attr.data-pos]="i">
          <i aria-hidden="true">{{ b.mark }}</i>
          <div><b>{{ b.title }}</b><span>{{ b.text }}</span></div>
        </div>
      }
    </figure>
  </div>
</section>
